[features]
seeds = false
skip-lint = false

[programs.localnet]
sol_bridge_lock = "9yJDb6VyjDHmQC7DLADDdLFm9wxWanXRM5x9SdZ3oVkF"
checkpoint_registry = "26xPyXG6C3E8zDW6te9FUZFQX6YRKe4DYzxE3BJUJLnY"

[programs.devnet]
sol_bridge_lock = "9yJDb6VyjDHmQC7DLADDdLFm9wxWanXRM5x9SdZ3oVkF"

[programs.mainnet]
sol_bridge_lock = "9yJDb6VyjDHmQC7DLADDdLFm9wxWanXRM5x9SdZ3oVkF"
checkpoint_registry = "26xPyXG6C3E8zDW6te9FUZFQX6YRKe4DYzxE3BJUJLnY"

[registry]
url = "https://api.apr.dev"

[provider]
# localnet so `anchor test` / `anchor deploy` cannot touch mainnet by accident.
# For a real mainnet operation, pass it explicitly:
#   anchor deploy --provider.cluster mainnet
cluster = "localnet"
wallet = "~/.config/solana/deployer.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000

[test.validator]
url = "https://api.devnet.solana.com"
