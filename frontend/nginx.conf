server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # The built bundle calls the API at the relative path /api/v1, so /api must
    # reach the API service. Without this, the SPA fallback below answers those
    # requests with index.html and the frontend parses HTML as JSON —
    # "Failed to create deposit instruction", and empty TVL/supply/transfers.
    location /api/ {
        # The upstream sits in a variable so nginx resolves it per request:
        # with a literal proxy_pass it resolves once at boot, refuses to start
        # if the API is not up yet, and keeps a stale IP if that container is
        # recreated.
        #
        # That form needs an explicit resolver. 127.0.0.11 is Docker's embedded
        # DNS, which exists only on user-defined networks (compose creates one).
        # Override DNS_RESOLVER when running somewhere that has none, or the
        # proxy fails and the SPA appears to load with no data.
        resolver           ${DNS_RESOLVER} valid=10s ipv6=off;
        set $api_upstream  ${API_UPSTREAM};
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/v1/transfer/:id/stream is Server-Sent Events: no buffering,
        # and it must be allowed to stay open.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # Long-lived hashed assets.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — deliberately after /api/ so it cannot shadow it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
